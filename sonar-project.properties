# SonarQube analysis for the back-end monorepo (the three services).
# Run locally:  npm run sonar   (see docs/ci-cd.md)
# Run in CI:    the "sonarqube" job in .github/workflows/ci.yml
sonar.projectKey=back-itinerary
sonar.projectName=back-itinerary
sonar.sourceEncoding=UTF-8

sonar.sources=apps/airport-service/src,apps/itinerary-service/src,apps/notification-function/src
sonar.tests=apps/airport-service/src,apps/itinerary-service/src,apps/notification-function/src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**,**/migrations/**

# Coverage produced by `npm run test:cov` (Jest, lcov) in each workspace.
sonar.javascript.lcov.reportPaths=apps/airport-service/coverage/lcov.info,apps/itinerary-service/coverage/lcov.info,apps/notification-function/coverage/lcov.info
# Bootstrap / wiring files have no logic worth covering.
sonar.coverage.exclusions=**/main.ts,**/*.module.ts,**/migrations/**,**/data-source.ts,**/*.dto.ts
