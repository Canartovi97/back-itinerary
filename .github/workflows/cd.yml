# Continuous deployment example: every merge into main publishes the three
# Docker images to GitHub Container Registry and deploys them, then a smoke
# test decides whether the deployment is healthy.
#
# The "deploy" job targets an ephemeral environment (the runner itself, with
# docker compose) so the example works without paying for a server. To deploy
# to a real host, replace its steps with an SSH step that runs the same
# `docker compose ... pull && up -d` there.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/canartovi97

jobs:
  publish:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [airport-service, itinerary-service, notification-function]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy & smoke test
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE_TAG: ${{ github.sha }}
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.cd.yml
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the images just published
        run: $COMPOSE pull airport-service itinerary-service notification-function

      - name: Start the stack
        run: $COMPOSE up -d --no-build

      - name: Smoke test
        run: sh scripts/smoke-test.sh

      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail=100

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
